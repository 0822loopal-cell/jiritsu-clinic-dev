<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>旧Ver.2 データ保全 R1</title><style>body{font:16px system-ui;background:#f3f7f6;color:#23434a;margin:24px}main{max-width:700px;margin:auto;background:white;padding:24px;border-radius:12px}label{display:block;margin-top:16px}input,button{font:inherit;padding:10px;max-width:95%}pre{white-space:pre-wrap;background:#edf4f1;padding:16px}</style></head><body><main><h1>旧Ver.2 データ保全 R1</h1><p>旧Ver.2保存領域だけを読み取り、既存正式版と互換の暗号化バックアップを作成します。DBの変更・復元・外部送信は行いません。</p><label>旧Ver.2のアプリ用パスフレーズ<br><input id="old" type="password" autocomplete="new-password"></label><label>新しいバックアップ専用パスフレーズ（12文字以上）<br><input id="p" type="password" autocomplete="new-password"></label><label>確認入力<br><input id="p2" type="password" autocomplete="new-password"></label><label><input id="saved" type="checkbox"> バックアップ専用パスフレーズを安全な場所に記録しました</label><p><button id="go">暗号化バックアップを作成</button></p><pre id="out" aria-live="polite">未実施</pre><p>パスフレーズやファイルの内容を共有しないでください。</p></main><script>
"use strict";
const E=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder(),DB="jiritsu-clinic-v2-test",S="settings",C="encryptedClientsProduction",un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64=a=>{let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s);};
async function keyFor(p,salt){const base=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function decrypt(r,key){return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un64(r.iv)},key,un64(r.ciphertext)));}
function openExisting(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB);q.onupgradeneeded=()=>q.transaction.abort();q.onerror=()=>reject(Error("旧保存領域を開けません"));q.onsuccess=()=>resolve(q.result);q.onblocked=()=>reject(Error("他のタブを閉じてください"));});}
function read(d){return new Promise((resolve,reject)=>{const tx=d.transaction([S,C],"readonly"),v=tx.objectStore(S).get("lockVerifier"),seq=tx.objectStore(S).get("clientSequenceProduction"),rows=[],q=tx.objectStore(C).openCursor();q.onsuccess=()=>{const c=q.result;if(c){rows.push({key:c.key,value:c.value});c.continue();}};tx.oncomplete=()=>resolve({v:v.result,sequence:seq.result,rows});tx.onabort=tx.onerror=()=>reject(Error("読み取り失敗"));});}
E("go").onclick=async()=>{let old=E("old").value,p=E("p").value,p2=E("p2").value,d;const out=E("out");if(!old||p.length<12||p.trim()!==p||p!==p2||p===old||!E("saved").checked){out.textContent="入力・確認欄を確認してください。専用パスフレーズはアプリ用と別にしてください。";return;}E("go").disabled=true;out.textContent="端末内で読み取り・暗号化中";try{d=await openExisting();const x=await read(d);d.close();d=null;if(!x.v||x.v.version!==1||un64(x.v.salt).length!==16)throw Error("ロック設定不正");const k=await keyFor(old,un64(x.v.salt));if(await decrypt(x.v,k)!=="JIRITSU-LOCK-PRODUCTION-V1")throw Error("ロック照合不一致");const clients=[],ids=new Set();for(const row of x.rows){const c=JSON.parse(await decrypt(row.value,k));if(typeof row.key!=="string"||!/^\d{4}$/.test(row.key)||row.key==="0000"||c.clientNo!==row.key||c.productionRecord!==true||ids.has(row.key))throw Error("記録照合不一致");ids.add(row.key);clients.push(c);}if(!clients.length||!Number.isSafeInteger(x.sequence)||x.sequence<Math.max(...[...ids].map(Number))||x.sequence>9999)throw Error("記録件数または発行連番が不正");const payload=JSON.stringify({format:"JIRITSU-CLIENTS-BACKUP-PAYLOAD-PRODUCTION-V1",createdAt:new Date().toISOString(),sequence:x.sequence,clients});const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),bk=await keyFor(p,salt),cipher=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},bk,enc.encode(payload)));if(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},await keyFor(p,salt),cipher))!==payload)throw Error("自己検証失敗");const blob=new Blob([JSON.stringify({format:"JIRITSU-CLIENTS-ENCRYPTED-BACKUP-PRODUCTION-V1",kdf:"PBKDF2-SHA256",iterations:310000,cipher:"AES-256-GCM",salt:b64(salt),iv:b64(iv),ciphertext:b64(cipher)})],{type:"application/json"});if(blob.size>25*1024*1024)throw Error("正式版の復元上限25MBを超過");const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="jiritsu-v2-rescue-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);out.textContent="暗号化・復号自己検証成功："+clients.length+"件\nダウンロードを開始しました。保存先でファイルを確認してください。DBは変更していません。";}catch(e){out.textContent="作成中断："+(e.name==="OperationError"?"復号失敗（パスフレーズまたは暗号化データ）":e.message);}finally{if(d)d.close();old=p=p2="";for(const id of ["old","p","p2"])E(id).value="";E("saved").checked=false;E("go").disabled=false;}};
</script></body></html>
