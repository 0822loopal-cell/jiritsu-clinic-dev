<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>STEP 153｜暗号化保存の統合検証</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#253c44;font:16px/1.7 system-ui,"Noto Sans JP",sans-serif}header{background:#fff;border-bottom:1px solid #dbe6e3;padding:18px}main{max-width:740px;margin:auto;padding:18px}section{background:#fff;border:1px solid #dce7e4;border-radius:14px;padding:20px;margin:0 0 16px}h1{font-size:1.35rem;margin:0}h2{font-size:1.1rem}label{display:block;font-weight:600;margin:12px 0 5px}input{font:inherit;width:100%;padding:12px;border:1px solid #bfd1cb;border-radius:9px}button{font:inherit;padding:12px 16px;border-radius:9px;border:1px solid #a6cbbc;background:#e4f3eb;color:#204b42;margin:12px 8px 4px 0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:not-allowed}.status{white-space:pre-wrap;background:#edf4f0;padding:14px;border-radius:9px}small{color:#586e69}a{color:#246451}[hidden]{display:none!important}</style></head><body>
<header><h1>STEP 153-②｜暗号化保存の共通基盤</h1><small>独立検証版 Ver.0.1.0｜Fireタブレット対応確認用</small></header>
<main><section><strong>架空データ専用の検証ページです。</strong><p>HOME・既存のバックアップテストとは別の保存領域を使用します。実際のクライアント情報や普段のパスワードは入力しないでください。</p></section>
<section id="locked"><h2 id="lock-title">初期化中</h2><label for="pass">テスト専用パスフレーズ（12文字以上）</label><input id="pass" type="password" autocomplete="off" minlength="12"><button id="unlock" disabled>準備中</button></section>
<section id="unlocked" hidden><h2>暗号化データの検証</h2><p>テスト専用データ：NO 0001／テスト専用</p><button id="save">架空データを暗号化して保存</button><button id="read">暗号化データを復号して確認</button><button id="relock">ロックする</button><p><small>保存先のIndexedDBには暗号文のみを保存します。復号用の鍵はロック中に保持しません。</small></p></section>
<section><h2>確認結果</h2><div id="status" class="status" role="status" aria-live="polite">初期化中…</div></section><p><a href="./">← HOMEへ戻る</a></p></main>
<script>
"use strict";
const DB="jiritsu-clinic-integration-test-v1",STORE="encrypted",enc=new TextEncoder(),dec=new TextDecoder();
const $=id=>document.getElementById(id),say=s=>$("status").textContent=s;
let db,key=null,configured=false;
const b64=b=>btoa(Array.from(b,n=>String.fromCharCode(n)).join(""));
const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function transaction(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),req=fn(tx.objectStore(STORE));let result;req.onsuccess=()=>result=req.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function derive(p,salt){const raw=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},raw,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encrypt(k,value){const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(value)));return {iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))};}
async function decrypt(k,record){const bytes=await crypto.subtle.decrypt({name:"AES-GCM",iv:un64(record.iv)},k,un64(record.ciphertext));return JSON.parse(dec.decode(bytes));}
function locked(){key=null;$("pass").value="";$("locked").hidden=false;$("unlocked").hidden=true;$("lock-title").textContent=configured?"アプリロック解除":"テスト用パスフレーズの初期設定";$("unlock").textContent=configured?"ロックを解除":"テスト用パスフレーズを設定";say(configured?"ロック中です。パスフレーズを入力してください。":"初回設定です。テスト用パスフレーズを12文字以上入力してください。");}
async function setup(){try{if(!("indexedDB" in window)||!crypto?.subtle)throw Error("必要なブラウザ機能が利用できません。");db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});configured=!!(await transaction("readonly",s=>s.get("verifier")));$("unlock").disabled=false;locked();}catch(e){say("初期化失敗："+e.message);}}
$("unlock").onclick=async()=>{const p=$("pass").value;if(p.length<12){say("パスフレーズは12文字以上入力してください。");return;}$("unlock").disabled=true;try{if(!configured){const salt=crypto.getRandomValues(new Uint8Array(16)),derived=await derive(p,salt),verifier=await encrypt(derived,{format:"JIRITSU-INTEGRATION-TEST-V1"});await transaction("readwrite",s=>s.put({salt:b64(salt),...verifier},"verifier"));key=derived;configured=true;}else{const record=await transaction("readonly",s=>s.get("verifier"));if(!record||typeof record.salt!=="string")throw Error("設定データが不正です。");const derived=await derive(p,un64(record.salt)),value=await decrypt(derived,record);if(value.format!=="JIRITSU-INTEGRATION-TEST-V1")throw Error("検証値が一致しません。");key=derived;}$("pass").value="";$("locked").hidden=true;$("unlocked").hidden=false;say("ロック解除成功。暗号化データの保存・確認ができます。");}catch(e){key=null;$("pass").value="";say("解除失敗：パスフレーズが違うか、設定が破損しています。");}finally{$("unlock").disabled=false;}};
$("save").onclick=async()=>{if(!key)return;try{const data={clientNo:"0001",label:"テスト専用",savedAt:new Date().toISOString()},encrypted=await encrypt(key,data);await transaction("readwrite",s=>s.put(encrypted,"demo"));say("架空データを暗号化して保存しました：NO 0001／テスト専用");}catch(e){say("保存失敗："+e.message);}};
$("read").onclick=async()=>{if(!key)return;try{const record=await transaction("readonly",s=>s.get("demo"));if(!record){say("保存データがありません。");return;}const data=await decrypt(key,record);if(data.clientNo!=="0001"||data.label!=="テスト専用")throw Error("テストデータの内容が不正です。");say("復号成功：NO "+data.clientNo+"／"+data.label+"\n保存日時："+data.savedAt);}catch(e){say("読み取り失敗："+e.message);}};
$("relock").onclick=locked;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&key)locked();});
setup();
</script></body></html>
