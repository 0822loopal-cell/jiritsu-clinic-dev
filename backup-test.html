<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>バックアップ・復元テスト｜自律調整院</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans JP",sans-serif;max-width:740px;margin:30px auto;padding:0 18px;background:#f5f8f7;color:#253d43;line-height:1.75}section{background:white;border:1px solid #d6e5df;border-radius:12px;padding:20px;margin:16px 0}h1{font-size:1.5rem}h2{font-size:1.1rem}button,input{font:inherit}button{padding:10px 14px;border-radius:8px;border:1px solid #9dc5b5;background:#e5f3eb;color:#1e5143;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5;cursor:not-allowed}input[type=password],input[type=file]{display:block;width:100%;max-width:560px;padding:10px;border:1px solid #c7d9d2;border-radius:8px}label{font-weight:600;display:block;margin:10px 0 5px}.status{white-space:pre-wrap;background:#edf4f0;border-radius:8px;padding:12px;min-height:60px}small{color:#596e6a}a{color:#246451}</style></head><body>
<h1>暗号化バックアップ・復元テスト</h1><p>STEP 152-C｜独立した架空データ検証ページ</p>
<section><strong>実際のクライアント情報や普段のパスワードは使用しないでください。</strong><p>固定の架空データ「NO 0001／テスト専用」のみ扱います。バックアップファイルはブラウザから手動で保存します。</p></section>
<section><h2>① テスト用データを作成</h2><button id="make" disabled>架空データをブラウザ内に保存</button><button id="check" disabled>現在の保存データを確認</button><button id="clear" disabled>ブラウザ内のテストデータを削除</button></section>
<section><h2>② 暗号化バックアップを書き出す</h2><label for="exportPass">バックアップ専用パスフレーズ（12文字以上）</label><input id="exportPass" type="password" autocomplete="off" minlength="12"><button id="export" disabled>暗号化バックアップを作成・保存</button><p><small>このパスフレーズはバックアップの復元に必要です。テスト専用の文字列を使ってください。</small></p></section>
<section><h2>③ ファイルから復元</h2><label for="importFile">保存したバックアップファイル（.json）</label><input id="importFile" type="file" accept=".json,application/json"><label for="importPass">バックアップ作成時のパスフレーズ</label><input id="importPass" type="password" autocomplete="off"><button id="restore" disabled>ファイルを検証して復元</button><p><small>復元時に同じテストデータが残っている場合は、上書き前に確認します。</small></p></section>
<section><h2>確認結果</h2><div id="status" class="status" role="status" aria-live="polite">初期化中…</div></section><p><a href="./">← HOMEへ戻る</a></p>
<script>
"use strict";
const DB="jiritsu-clinic-backup-test-v1",STORE="records",ID="demo";
const status=document.getElementById("status"),ep=document.getElementById("exportPass"),ip=document.getElementById("importPass"),file=document.getElementById("importFile");
const btns=["make","check","clear","export","restore"].map(id=>document.getElementById(id));
const enc=new TextEncoder(),dec=new TextDecoder();let db;
function say(s){status.textContent=s;}
function b64(bytes){let str="";for(const n of bytes)str+=String.fromCharCode(n);return btoa(str);}
function un64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
function request(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),r=fn(tx.objectStore(STORE));let value;r.onsuccess=()=>value=r.result;tx.oncomplete=()=>resolve(value);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function keyFor(pass,salt){const raw=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},raw,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
function validData(data){return data&&data.format==="JIRITSU-BACKUP-PAYLOAD-V1"&&Array.isArray(data.records)&&data.records.length===1&&data.records[0].clientNo==="0001"&&data.records[0].label==="テスト専用"&&typeof data.records[0].savedAt==="string";}
function lock(yes){btns.forEach(b=>b.disabled=yes);}
async function setup(){if(!indexedDB||!crypto?.subtle){say("必要な保存・暗号化機能が利用できません。");return;}try{db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});lock(false);say("準備完了。まず「架空データをブラウザ内に保存」を押してください。");}catch(e){say("初期化失敗："+e.message);}}
document.getElementById("make").onclick=async()=>{try{await request("readwrite",s=>s.put({clientNo:"0001",label:"テスト専用",savedAt:new Date().toISOString()},ID));say("架空データを保存しました：NO 0001／テスト専用");}catch(e){say("保存失敗："+e.message);}};
document.getElementById("check").onclick=async()=>{try{const r=await request("readonly",s=>s.get(ID));say(r?"保存データあり：NO "+r.clientNo+"／"+r.label+"\n保存日時："+r.savedAt:"保存データなし。");}catch(e){say("確認失敗："+e.message);}};
document.getElementById("clear").onclick=async()=>{if(!confirm("ブラウザ内の架空テストデータを削除しますか？"))return;try{await request("readwrite",s=>s.delete(ID));say("ブラウザ内のテストデータを削除しました。バックアップファイルは削除されません。");}catch(e){say("削除失敗："+e.message);}};
document.getElementById("export").onclick=async()=>{if(ep.value.length<12){say("バックアップ用パスフレーズを12文字以上入力してください。");return;}lock(true);try{const record=await request("readonly",s=>s.get(ID));if(!record){say("先に架空データを保存してください。");return;}const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await keyFor(ep.value,salt);const plaintext=enc.encode(JSON.stringify({format:"JIRITSU-BACKUP-PAYLOAD-V1",records:[record]}));const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plaintext);const envelope={format:"JIRITSU-ENCRYPTED-BACKUP-TEST-V1",kdf:"PBKDF2-SHA256",iterations:310000,cipher:"AES-256-GCM",salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(encrypted))};const blob=new Blob([JSON.stringify(envelope,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="jiritsu-backup-TEST-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);say("暗号化バックアップを作成しました。\nブラウザのダウンロード一覧でファイル保存を確認してください。");}catch(e){say("バックアップ失敗："+e.message);}finally{ep.value="";lock(false);}};
document.getElementById("restore").onclick=async()=>{if(!file.files||file.files.length!==1){say("バックアップファイルを選択してください。");return;}if(!ip.value){say("バックアップ作成時のパスフレーズを入力してください。");return;}lock(true);try{const selected=file.files[0];if(selected.size>1024*1024)throw Error("テスト用ファイルの上限1MBを超えています。");const envelope=JSON.parse(await selected.text());if(envelope.format!=="JIRITSU-ENCRYPTED-BACKUP-TEST-V1"||envelope.kdf!=="PBKDF2-SHA256"||envelope.iterations!==310000||envelope.cipher!=="AES-256-GCM")throw Error("対応していないバックアップ形式です。");const salt=un64(envelope.salt),iv=un64(envelope.iv),ciphertext=un64(envelope.ciphertext);if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw Error("暗号化データの形式が不正です。");const key=await keyFor(ip.value,salt),plaintext=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ciphertext);const payload=JSON.parse(dec.decode(plaintext));if(!validData(payload))throw Error("復号後のデータ形式が不正です。");const existing=await request("readonly",s=>s.get(ID));if(existing&&!confirm("ブラウザ内の既存の架空テストデータを上書きしますか？")){say("復元をキャンセルしました。");return;}await request("readwrite",s=>s.put(payload.records[0],ID));say("復元成功：NO 0001／テスト専用\n保存日時："+payload.records[0].savedAt);}catch(e){say(e.name==="OperationError"?"復元失敗：パスフレーズが違うか、ファイルが破損しています。":"復元失敗："+e.message);}finally{ip.value="";lock(false);}};
setup();
</script></body></html>
