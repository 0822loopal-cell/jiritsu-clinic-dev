<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>正式版 読み取り専用診断 D1</title><style>body{font:16px system-ui,sans-serif;background:#f3f7f6;color:#23434a;margin:32px}main{max-width:800px;margin:auto;background:white;border:1px solid #bfd6cd;border-radius:12px;padding:24px}button,input{font:inherit;padding:12px;margin:8px 0}input{width:90%;max-width:460px}pre{white-space:pre-wrap;background:#edf4f1;padding:16px}</style></head><body><main><h1>正式版 読み取り専用診断 D1</h1><p>対象：Ver.2.0.1。保存・削除・復元・外部送信は行いません。氏名や記録本文は表示しません。</p><button id="scan">保存状態を確認</button><pre id="out" aria-live="polite">未確認</pre><label for="pass">正式版アプリ用パスフレーズ（任意・端末内照合のみ）</label><br><input id="pass" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="off"><br><button id="test" disabled>復号可否を確認</button><p>共有するのは上の結果のみ。パスフレーズは共有しないでください。</p></main><script>
"use strict";
const DB="jiritsu-clinic-production-v1",S="settings",C="encryptedClientsProduction",R="lockVerifier";
const el=id=>document.getElementById(id), enc=new TextEncoder(),dec=new TextDecoder(),un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let busy=false;
function openExisting(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB);q.onupgradeneeded=()=>{q.transaction.abort();};q.onerror=()=>reject(new Error("保存領域を開けません（新規作成は禁止）"));q.onsuccess=()=>{const d=q.result;d.onversionchange=()=>d.close();resolve(d);};q.onblocked=()=>reject(new Error("別タブの影響で開けません"));});}
function snapshot(d){return new Promise((resolve,reject)=>{if(!d.objectStoreNames.contains(S)||!d.objectStoreNames.contains(C)){reject(new Error("必要な保存領域がありません"));return;}const tx=d.transaction([S,C],"readonly"),v=tx.objectStore(S).get(R),n=tx.objectStore(C).count(),rows=[];const q=tx.objectStore(C).openCursor();q.onsuccess=()=>{const c=q.result;if(c){rows.push({key:c.key,value:c.value});c.continue();}};tx.oncomplete=()=>resolve({record:v.result,count:n.result,rows,version:d.version});tx.onerror=()=>reject(new Error("読み取りエラー"));tx.onabort=()=>reject(new Error("読み取り中断"));});}
function bytes(s){if(typeof s!=="string")return -1;try{return un64(s).length;}catch{return -1;}}
function envelope(r){return !!r&&bytes(r.iv)===12&&bytes(r.ciphertext)>16;}
async function keyFor(p,salt){const base=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function decrypt(r,key){return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un64(r.iv)},key,un64(r.ciphertext)));}
async function run(verify){if(busy)return;busy=true;el("scan").disabled=true;el("test").disabled=true;let p=verify?el("pass").value:"";el("pass").value="";let d;const out=[];try{d=await openExisting();const x=await snapshot(d),r=x.record;out.push("DBバージョン："+x.version,"ロック設定："+(r?"存在":"なし"),"設定形式："+(r&&r.version===1&&bytes(r.salt)===16&&envelope(r)?"正常な構造":"異常または未設定"),"保存クライアント件数："+x.count,"暗号化レコード構造正常："+x.rows.filter(y=>envelope(y.value)).length+"／"+x.count);if(verify){if(!p||!r||bytes(r.salt)!==16){out.push("復号確認：実施不可");}else{const key=await keyFor(p,un64(r.salt));p="";try{out.push("ロック確認用データ："+((await decrypt(r,key))==="JIRITSU-LOCK-PRODUCTION-V1"?"復号・照合成功":"復号成功・内容不一致"));}catch{out.push("ロック確認用データ：復号失敗");}let ok=0,fail=0,mismatch=0;for(const row of x.rows){try{const data=JSON.parse(await decrypt(row.value,key));if(data.clientNo===row.key&&data.productionRecord===true)ok++;else mismatch++;}catch{fail++;}}out.push("クライアント復号・照合成功："+ok+"件","復号・解析失敗："+fail+"件","内容不一致："+mismatch+"件");}}el("test").disabled=!r||bytes(r.salt)!==16;}catch(e){out.push("診断中断："+e.message);}finally{p="";if(d)d.close();el("out").textContent=out.join("\n");el("scan").disabled=false;busy=false;}}
el("scan").onclick=()=>run(false);el("test").onclick=()=>run(true);
</script></body></html>
